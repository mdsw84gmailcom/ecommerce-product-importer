[project]
name = "ecommerce-product-importer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marian De Silva", email = "mdsw84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
ecommerce-product-importer = "ecommerce_product_importer:main"

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
