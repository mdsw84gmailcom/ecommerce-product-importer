[project]
name = "ecommerce-product-importer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marian De Silva", email = "mdsw84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
ecommerce-product-importer = "ecommerce_product_importer:main"

[build-system]
